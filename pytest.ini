[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    cli: tests requiring langgraph CLI
    slow: slow tests (deselect with '-m "not slow"')
    asyncio: async tests
